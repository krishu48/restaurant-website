<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - La Belle Vie</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ===== PREMIUM LOGIN PAGE STYLES ===== */

        .auth-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a0a 40%, #2d0f0f 70%, #722F37 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .auth-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=1920&q=80') center/cover;
            opacity: 0.06;
            animation: heroZoomSlow 30s ease-in-out infinite alternate;
        }

        @keyframes heroZoomSlow {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        /* Floating Particles */
        .auth-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .auth-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(201, 169, 110, 0.15);
            border-radius: 50%;
            animation: floatParticle 20s infinite linear;
        }

        .auth-particle:nth-child(1) { left: 10%; animation-duration: 25s; animation-delay: 0s; }
        .auth-particle:nth-child(2) { left: 30%; animation-duration: 30s; animation-delay: 3s; width: 6px; height: 6px; }
        .auth-particle:nth-child(3) { left: 50%; animation-duration: 22s; animation-delay: 5s; }
        .auth-particle:nth-child(4) { left: 70%; animation-duration: 28s; animation-delay: 1s; width: 8px; height: 8px; }
        .auth-particle:nth-child(5) { left: 90%; animation-duration: 18s; animation-delay: 7s; }
        .auth-particle:nth-child(6) { left: 20%; animation-duration: 32s; animation-delay: 2s; width: 5px; height: 5px; }
        .auth-particle:nth-child(7) { left: 60%; animation-duration: 24s; animation-delay: 4s; }
        .auth-particle:nth-child(8) { left: 80%; animation-duration: 20s; animation-delay: 6s; width: 7px; height: 7px; }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(720deg) scale(1.5); opacity: 0; }
        }

        /* Floating Orbs */
        .auth-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.08;
            pointer-events: none;
            animation: orbFloat 15s ease-in-out infinite alternate;
        }

        .auth-orb-1 {
            width: 400px;
            height: 400px;
            background: #C9A96E;
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .auth-orb-2 {
            width: 300px;
            height: 300px;
            background: #722F37;
            bottom: -50px;
            left: -50px;
            animation-delay: -5s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -30px) scale(1.1); }
            66% { transform: translate(-30px, 50px) scale(0.9); }
            100% { transform: translate(20px, 20px) scale(1.05); }
        }

        /* Auth Card - Glassmorphism */
        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-radius: 24px;
            padding: 3rem;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            animation: slideUp 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            z-index: 3;
            border: 1px solid rgba(201, 169, 110, 0.1);
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(60px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .auth-card .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-card .logo h2 {
            font-family: 'Playfair Display', serif;
            color: #722F37;
            font-size: 2.2rem;
            transition: all 0.5s ease;
        }

        .auth-card .logo h2 i {
            color: #C9A96E;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .auth-card .logo h2:hover i {
            transform: rotate(-20deg) scale(1.15);
        }

        .auth-card h3 {
            font-family: 'Playfair Display', serif;
            color: #2D2D2D;
            margin-bottom: 0.3rem;
            font-size: 1.8rem;
        }

        .auth-card .subtitle {
            color: #6b6b6b;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .auth-card .form-control {
            border-radius: 12px;
            padding: 0.9rem 1.2rem;
            border: 2px solid #e8e0d8;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            background: #faf8f6;
        }

        .auth-card .form-control:focus {
            border-color: #C9A96E;
            box-shadow: 0 0 0 4px rgba(201, 169, 110, 0.1);
            background: #ffffff;
        }

        .auth-card .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #2D2D2D;
            margin-bottom: 0.4rem;
        }

        .auth-card .btn-gold {
            width: 100%;
            padding: 0.9rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            margin-top: 0.5rem;
            background: linear-gradient(145deg, #C9A96E, #dbb87a);
            color: #1a1a1a;
            border: none;
            box-shadow: 0 4px 20px rgba(201, 169, 110, 0.3);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .auth-card .btn-gold::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .auth-card .btn-gold:hover::before {
            opacity: 1;
        }

        .auth-card .btn-gold:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 40px rgba(201, 169, 110, 0.4);
        }

        .auth-card .auth-switch {
            text-align: center;
            margin-top: 1.8rem;
            color: #6b6b6b;
            font-size: 0.95rem;
        }

        .auth-card .auth-switch a {
            color: #722F37;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .auth-card .auth-switch a:hover {
            color: #C9A96E;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.85rem;
            margin: 0.5rem 0;
            display: none;
            padding: 10px 14px;
            background: rgba(220, 53, 69, 0.08);
            border-radius: 8px;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle .toggle-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6b6b6b;
            transition: all 0.3s ease;
            padding: 5px;
        }

        .password-toggle .toggle-icon:hover {
            color: #722F37;
        }

        .forgot-link {
            text-align: right;
            margin-top: -0.5rem;
            margin-bottom: 1rem;
        }

        .forgot-link a {
            color: #6b6b6b;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .forgot-link a:hover {
            color: #722F37;
        }

        .divider-text {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #b0b0b0;
            font-size: 0.85rem;
        }

        .divider-text::before,
        .divider-text::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0d6ce;
        }

        .divider-text::before { margin-right: 1rem; }
        .divider-text::after { margin-left: 1rem; }

        .back-home {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-home a {
            color: #6b6b6b;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .back-home a:hover {
            color: #722F37;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 1.5rem 0;
        }

        .social-login .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #e8e0d8;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: #6b6b6b;
            font-size: 1.2rem;
            text-decoration: none;
        }

        .social-login .social-btn:hover {
            border-color: #C9A96E;
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 10px 30px rgba(201, 169, 110, 0.15);
        }

        .social-login .social-btn.facebook:hover {
            background: #3b5998;
            color: white;
            border-color: #3b5998;
        }

        .social-login .social-btn.google:hover {
            background: #db4437;
            color: white;
            border-color: #db4437;
        }

        .social-login .social-btn.twitter:hover {
            background: #1da1f2;
            color: white;
            border-color: #1da1f2;
        }

        /* Responsive */
        @media (max-width: 576px) {
            .auth-card { padding: 2rem; }
            .auth-card .logo h2 { font-size: 1.6rem; }
            .auth-card h3 { font-size: 1.5rem; }
        }

        /* Loading spinner on button */
        .btn-gold.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .btn-gold .spinner {
            display: none;
            margin-right: 8px;
            animation: spin 1s linear infinite;
        }

        .btn-gold.loading .spinner {
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <!-- Floating Particles -->
        <div class="auth-particles">
            <div class="auth-particle"></div>
            <div class="auth-particle"></div>
            <div class="auth-particle"></div>
            <div class="auth-particle"></div>
            <div class="auth-particle"></div>
            <div class="auth-particle"></div>
            <div class="auth-particle"></div>
            <div class="auth-particle"></div>
        </div>

        <!-- Floating Orbs -->
        <div class="auth-orb auth-orb-1"></div>
        <div class="auth-orb auth-orb-2"></div>

        <div class="auth-card">
            <div class="logo">
                <a href="index.html" style="text-decoration: none;">
                    <h2><i class="fas fa-utensils"></i> La Belle Vie</h2>
                </a>
            </div>

            <h3>Welcome Back</h3>
            <p class="subtitle">Sign in to continue your culinary journey</p>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" required placeholder="you@example.com">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-toggle">
                        <input type="password" class="form-control" id="password" required placeholder="Enter your password">
                        <span class="toggle-icon" onclick="togglePassword('password')">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>

                <div class="forgot-link">
                    <a href="#">Forgot password?</a>
                </div>

                <div id="loginError" class="error-message"></div>

                <button type="submit" class="btn btn-gold" id="loginBtn">
                    <span class="spinner"><i class="fas fa-spinner"></i></span>
                    <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Sign In</span>
                </button>
            </form>

            <div class="divider-text">or continue with</div>

            <div class="social-login">
                <a href="#" class="social-btn facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social-btn google"><i class="fab fa-google"></i></a>
                <a href="#" class="social-btn twitter"><i class="fab fa-twitter"></i></a>
            </div>

            <p class="auth-switch">
                Don't have an account? <a href="signup.html">Create Account</a>
            </p>

            <div class="back-home">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>

    <script>
        // Toggle Password Visibility
        function togglePassword(id) {
            const input = document.getElementById(id);
            const icon = input.parentElement.querySelector('.toggle-icon i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // Login Form Handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            // Validate
            if (!email || !password) {
                errorDiv.textContent = 'Please fill in all fields.';
                errorDiv.style.display = 'block';
                return;
            }

            // Show loading state
            btn.classList.add('loading');
            errorDiv.style.display = 'none';

            // Simulate login (replace with Firebase auth)
            setTimeout(() => {
                // Success - redirect to home
                window.location.href = 'index.html';
            }, 1500);
        });

        // Check if user is already logged in (from auth.js)
        // This will be handled by your existing auth.js
    </script>
</body>
</html>
