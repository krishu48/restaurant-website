<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Successful - La Belle Vie</title>
       <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23722F37'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23C9A96E' font-family='Georgia,serif' font-weight='900'%3EL%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f8f5f2, #f0e8e0); min-height: 100vh; padding: 60px 20px; }
        .card-success { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 24px; padding: 50px 40px; box-shadow: 0 30px 80px rgba(0,0,0,0.1); text-align: center; }
        .check-icon { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(145deg, #27ae60, #1e8c4c); color: #fff; font-size: 3rem; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 25px; animation: pop 0.6s cubic-bezier(0.34,1.56,0.64,1); }
        @keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
        h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 900; color: #2D2D2D; margin-bottom: 10px; }
        h1 span { color: #722F37; }
        .order-num { font-size: 0.95rem; color: #6b6b6b; margin-bottom: 25px; }
        .detail-box { background: #f8f5f2; border-radius: 16px; padding: 25px; margin: 25px 0; text-align: left; }
        .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e8dfd0; }
        .detail-row:last-child { border-bottom: none; }
        .detail-row.grand { font-size: 1.3rem; font-weight: 800; color: #722F37; padding-top: 15px; margin-top: 10px; border-top: 2px solid #722F37; }
        .btn-row { display: flex; gap: 12px; justify-content: center; margin-top: 25px; flex-wrap: wrap; }
        .btn-gold { background: linear-gradient(145deg, #C9A96E, #dbb87a); color: #1a1a1a; padding: 14px 30px; border-radius: 50px; font-weight: 700; text-decoration: none; border: none; cursor: pointer; }
        .btn-outline { background: transparent; border: 2px solid #C9A96E; color: #722F37; padding: 14px 30px; border-radius: 50px; font-weight: 700; text-decoration: none; }
        .btn-gold:hover, .btn-outline:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(201,169,110,0.35); }
    </style>
</head>
<body>
    <div class="card-success">
        <div class="check-icon"><i class="fas fa-check"></i></div>
        <h1>Payment <span>Successful!</span></h1>
        <p class="order-num">Order #<strong id="orderNum">-</strong></p>

        <div class="detail-box" id="details">
            <div class="detail-row"><span>Amount Paid</span><span id="amountPaid">-</span></div>
            <div class="detail-row"><span>Payment Method</span><span>UPI / QR</span></div>
            <div class="detail-row"><span>Status</span><span style="color:#27ae60;font-weight:700;">✓ Confirmed</span></div>
        </div>

        <p style="color:#666;">Thank you for dining with La Belle Vie!</p>

        <div class="btn-row">
            <button onclick="window.print()" class="btn-gold"><i class="fas fa-print"></i> Print Receipt</button>
            <a href="menu.html" class="btn-outline"><i class="fas fa-utensils"></i> Order More</a>
        </div>
    </div>

    <script>
    (async function () {
        const params = new URLSearchParams(window.location.search);
        const orderNumber = params.get('order');
        if (!orderNumber) return;

        document.getElementById('orderNum').textContent = orderNumber;

        // Optional: fetch order to show amount
        try {
            const res = await fetch('api/generate_qr.php?order_number=' + encodeURIComponent(orderNumber));
            const data = await res.json();
            if (data.success) {
                document.getElementById('amountPaid').textContent = '$' + data.amount.toFixed(2);
            }
        } catch (e) {}
    })();
    </script>
</body>
</html>
