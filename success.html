<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - La Belle Vie</title>
       <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23722F37'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23C9A96E' font-family='Georgia,serif' font-weight='900'%3EL%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8f5f2 0%, #f0e8e0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: #2D2D2D;
        }

        .success-card {
            background: #fff;
            border-radius: 28px;
            padding: 60px 50px;
            max-width: 560px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(201, 169, 110, 0.1);
        }

        .check-icon {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(145deg, #27ae60, #1e8c4c);
            color: #fff;
            font-size: 3.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
            box-shadow: 0 15px 40px rgba(39, 174, 96, 0.3);
            animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes pop {
            0%   { transform: scale(0); }
            60%  { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .success-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 900;
            color: #2D2D2D;
            margin-bottom: 12px;
        }

        .success-card h1 span {
            color: #722F37;
        }

        .success-card .subtitle {
            color: #6b6b6b;
            font-size: 1.05rem;
            margin-bottom: 30px;
        }

        .order-details {
            background: #f8f5f2;
            border-radius: 16px;
            padding: 25px 28px;
            margin: 25px 0;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #ece6de;
            font-size: 0.95rem;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-row .label {
            color: #6b6b6b;
            font-weight: 500;
        }

        .detail-row .value {
            font-weight: 700;
            color: #2D2D2D;
        }

        .detail-row.grand .value {
            color: #722F37;
            font-size: 1.25rem;
        }

        .detail-row.status .value {
            color: #27ae60;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .btn-action {
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-gold {
            background: linear-gradient(145deg, #C9A96E, #dbb87a);
            color: #1a1a1a;
            box-shadow: 0 6px 20px rgba(201, 169, 110, 0.3);
        }

        .btn-gold:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(201, 169, 110, 0.4);
            color: #1a1a1a;
        }

        .btn-outline {
            background: transparent;
            color: #722F37;
            border: 2px solid #C9A96E;
        }

        .btn-outline:hover {
            background: #C9A96E;
            color: #1a1a1a;
            transform: translateY(-3px);
        }

        @media (max-width: 576px) {
            .success-card {
                padding: 40px 25px;
                border-radius: 20px;
            }

            .success-card h1 { font-size: 1.8rem; }
            .check-icon { width: 90px; height: 90px; font-size: 2.6rem; }
            .actions { flex-direction: column; }
            .btn-action { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="success-card">

        <div class="check-icon">
            <i class="fas fa-check"></i>
        </div>

        <h1>Payment <span>Successful!</span></h1>
        <p class="subtitle">Thank you for dining with La Belle Vie</p>

        <div class="order-details">
            <div class="detail-row">
                <span class="label"><i class="fas fa-receipt" style="color:#C9A96E;"></i> Order Number</span>
                <span class="value" id="orderNum">—</span>
            </div>
            <div class="detail-row">
                <span class="label"><i class="fas fa-credit-card" style="color:#C9A96E;"></i> Amount Paid</span>
                <span class="value" id="orderAmount">—</span>
            </div>
            <div class="detail-row">
                <span class="label"><i class="fas fa-qrcode" style="color:#C9A96E;"></i> Payment Method</span>
                <span class="value">UPI / QR Code</span>
            </div>
            <div class="detail-row">
                <span class="label"><i class="fas fa-calendar-check" style="color:#C9A96E;"></i> Date</span>
                <span class="value" id="orderDate">—</span>
            </div>
            <div class="detail-row status">
                <span class="label"><i class="fas fa-check-circle" style="color:#27ae60;"></i> Status</span>
                <span class="value">✓ Confirmed</span>
            </div>
        </div>

        <p style="color:#6b6b6b;font-size:0.9rem;">
            A confirmation has been sent. Please save your order number.
        </p>

        <div class="actions">
            <button onclick="window.print()" class="btn-action btn-gold">
                <i class="fas fa-print"></i> Print Receipt
            </button>
            <a href="menu.html" class="btn-action btn-outline">
                <i class="fas fa-utensils"></i> Order More
            </a>
        </div>

    </div>

    <script>
        // Read URL parameters
        const params = new URLSearchParams(window.location.search);
        const order  = params.get('order')  || '—';
        const amount = params.get('amount') || '0.00';

        // Fill in details
        document.getElementById('orderNum').textContent    = order;
        document.getElementById('orderAmount').textContent = '$' + parseFloat(amount).toFixed(2);
        document.getElementById('orderDate').textContent   = new Date().toLocaleString('en-US', {
            weekday: 'long', year: 'numeric', month: 'long',
            day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
    </script>

</body>
</html>
